<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — NSUK Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>
<div id="toast"></div>

<nav class="navbar" id="navbar"></nav>
<nav class="mobile-nav"><div class="mobile-nav-inner" id="mobile-nav-inner"></div></nav>

<div class="main-wrap">
  <div class="page-inner">
    <div class="page-header"><h1>Notifications</h1></div>
    <div id="notif-list">
      <div class="spin-wrap"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
let currentUser = null;

requireAuth(async user => {
  currentUser = user;
  _currentUid = user.uid;
  const userData = await getUser(user.uid);
  buildNav('notifications');
  fillNavUser(userData);
  loadNotifications();
  markAllRead();
});

async function loadNotifications() {
  const listEl = document.getElementById('notif-list');

  db.collection('notifications')
    .where('targetUserId', '==', currentUser.uid)
    .orderBy('timestamp', 'desc')
    .limit(50)
    .onSnapshot(async snap => {
      if (snap.empty) {
        listEl.innerHTML = `
          <div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <h3>No notifications yet</h3>
            <p>When someone likes or comments on your posts, you'll see it here.</p>
          </div>`;
        return;
      }

      const rows = await Promise.all(snap.docs.map(async d => {
        const n    = d.data();
        const from = await getUser(n.fromUserId);
        if (!from) return '';

        const av     = avatarHtml(from, 42);
        const action = n.type === 'like'    ? 'liked your post'
                     : n.type === 'comment' ? 'commented on your post'
                     :                        'started following you';
        const unread = !n.read ? 'background:var(--green-light);' : '';

        return `
          <div class="notif-row" style="${unread}cursor:pointer;" onclick="window.location.href='profile.html?uid=${n.fromUserId}'">
            ${av}
            <div class="notif-body"><strong>${esc(from.displayName||from.username)}</strong> ${action}</div>
            <div class="notif-time">${timeAgo(n.timestamp)}</div>
            ${n.postImage ? `<div class="notif-thumb"><img src="${n.postImage}" alt="post"></div>` : ''}
          </div>`;
      }));

      listEl.innerHTML = `<div class="notif-list">${rows.join('')}</div>`;
      setNotifBadge(0);
    });
}

async function markAllRead() {
  const snap = await db.collection('notifications')
    .where('targetUserId', '==', currentUser.uid)
    .where('read', '==', false).get();
  const batch = db.batch();
  snap.docs.forEach(d => batch.update(d.ref, { read: true }));
  if (!snap.empty) await batch.commit();
}
</script>
</body>
</html>
